    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 0;
      color: var(--ink);
      background: var(--paper);
      background-image:
        radial-gradient(ellipse at 50% 38%, #fffbf3 1%, #fffbf300 66%),
        radial-gradient(ellipse at 80% 62%, #efcabd50, transparent 60%),
        linear-gradient(117deg, #f5e7df, #fbf2eb 51%, #f3e0d9);
      font-family: var(--sans);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: var(--grain);
      opacity: .43;
      pointer-events: none;
    }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--wine); outline-offset: 5px; }
    .svg-library { width: 0; height: 0; position: absolute; overflow: hidden; pointer-events: none; }
    .frame {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      margin: var(--inset);
      min-height: calc(100vh - 2 * var(--inset));
      min-height: calc(100svh - 2 * var(--inset));
      border: 1px solid #d8b3ad;
    }
    .frame::before {
      content: '';
      inset: 4px;
      position: absolute;
      border: 1px solid #dfc0b867;
      pointer-events: none;
      z-index: 8;
    }
    .frame-corner {
      position: absolute;
      z-index: 9;
      width: 5px;
      height: 5px;
      background: #c68e8d;
      transform: rotate(45deg);
      pointer-events: none;
    }
    .frame-corner--tl { top: -3px; left: -3px; }
    .frame-corner--tr { top: -3px; right: -3px; }
    .frame-corner--bl { bottom: -3px; left: -3px; }
    .frame-corner--br { bottom: -3px; right: -3px; }

    .masthead, .colophon {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-inline: clamp(15px, 2.6vw, 40px);
      color: var(--muted);
    }
    .masthead {
      min-height: clamp(52px, 7.2svh, 70px);
      border-bottom: 1px solid var(--rule);
    }
    .wordmark, .edition, .colophon p {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 600;
    }
    .wordmark { color: #713748; }
    .wordmark svg { width: 31px; height: 33px; flex: none; }
    .edition { gap: 7px; }
    .edition svg { width: 11px; height: 11px; color: #af6d79; flex: none; }
    .colophon {
      min-height: clamp(39px, 5.7svh, 56px);
      border-top: 1px solid var(--rule);
    }
    .colophon p { font-size: 12px; font-weight: 500; gap: 7px; }
    .colophon svg { width: 11px; height: 11px; color: #a65b70; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-block: clamp(20px, 2.85svh, 34px);
      min-width: 0;
      text-align: center;
    }
    .intro {
      --open-lift: clamp(8px, 1.6svh, 15px);
      position: relative;
      z-index: 2;
      padding: 0 13px 24px;
      transition: transform .64s var(--ease);
    }
    .intro.is-lifted { transform: translateY(calc(-1 * var(--open-lift))); }
    .eyebrow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin: 0 0 clamp(5px, .8svh, 9px);
      color: #925066;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }
    .eyebrow svg { width: 45px; height: 11px; color: #bf8490; }
    h1 {
      margin: 0;
      font-family: var(--arabic);
      font-size: clamp(60px, min(12.2svh, 12.4vw), 111px);
      font-weight: 700;
      line-height: 1.13;
    }
    .recipient { color: var(--rose); }

    .stage {
      --envelope: min(510px, clamp(330px, 54svh, 510px), calc(100vw - 96px));
      --tilt: -6deg;
      --closed-center: 51%;
      position: relative;
      isolation: isolate;
      width: min(calc(100% - 10px), 880px);
      height: calc(var(--envelope) * .62 + 58px);
      margin-block: 3px 6px;
    }
    .postmark, .opening-arrow, .spark { position: absolute; pointer-events: none; }
    .opening-arrow {
      z-index: 2;
      top: calc(var(--closed-center) - var(--envelope) * .304 - 7px);
      left: calc(50% + 2px);
      width: clamp(29px, calc(var(--envelope) * .083), 44px);
      height: auto;
      color: #a6566d;
      transform: translate(-50%, -100%);
      transition: opacity .19s ease, transform .32s var(--ease);
    }
    .stage.is-open .opening-arrow { opacity: 0; transform: translate(-50%, -83%) scale(.88); }
    .postmark {
      width: clamp(112px, calc(var(--envelope) * .32), 158px);
      height: auto;
      left: calc(50% + var(--envelope) * .438);
      top: 2%;
      transform: rotate(12deg);
      color: #b37583;
      opacity: .88;
      transition: transform .7s var(--ease), opacity .7s ease;
    }
    .postmark text {
      font-family: var(--hand);
      font-size: 16px;
      font-weight: 700;
      fill: currentColor;
    }
    .spark { color: #be7a8b; transition: transform .75s var(--ease); }
    .spark--nw { top: 12%; right: calc(50% + var(--envelope) * .535); width: 29px; height: 31px; }
    .spark--se { bottom: 10%; left: calc(50% + var(--envelope) * .52); width: 45px; height: 42px; }
    .stage.is-open .postmark { opacity: .62; transform: rotate(16deg) translate(4px, 3px); }
    .stage.is-open .spark--nw { transform: translate(-4px, 7px) rotate(10deg); }
    .stage.is-open .spark--se { transform: translate(5px, 6px) rotate(14deg); }

    .desk-shadow {
      pointer-events: none;
      position: absolute;
      z-index: 0;
      width: calc(var(--envelope) * 1.13);
      height: calc(var(--envelope) * .21);
      top: 79%;
      left: 50%;
      transform: translate(-48%, -43%) rotate(var(--tilt));
      background: radial-gradient(ellipse closest-side, #96566238, #96566203 84%, transparent 100%);
      filter: blur(12px);
      transition: top .75s var(--ease), transform .75s var(--ease);
    }
    .stage.is-open .desk-shadow { top: 90%; transform: translate(-47%, -43%) rotate(var(--tilt)) scale(.83); }
    .envelope, .envelope-trigger {
      position: absolute;
      top: var(--closed-center);
      left: 50%;
      width: var(--envelope);
      aspect-ratio: 500 / 306;
      transform: translate(-50%,-50%) rotate(var(--tilt));
      border-radius: 10px;
    }
    .envelope {
      z-index: 1;
      isolation: isolate;
      transition: transform .78s var(--ease), top .78s var(--ease);
    }
    .envelope-trigger {
      z-index: 3;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .envelope-trigger[hidden] { display: none; }
    @media (hover: hover) {
      .stage:has(.envelope-trigger:hover):not(.is-open) .envelope {
        transform: translate(-50%,-52.5%) rotate(-4.5deg);
      }
      .stage:has(.envelope-trigger:hover):not(.is-open) .seal {
        filter: drop-shadow(0 5px 5px #63263e68) brightness(1.075);
      }
    }
    .stage.is-open .envelope {
      top: 62.5%;
      transform: translate(-50%,-50%) rotate(var(--tilt)) scale(.78);
    }
    .envelope-back, .envelope-pocket, .seal {
      pointer-events: none;
      display: block;
      position: absolute;
      overflow: visible;
    }
    .envelope-back, .envelope-pocket { inset: 0; width: 100%; height: 100%; }
    .envelope-back {
      z-index: 0;
      filter: drop-shadow(0 3px 2px #8a435c24) drop-shadow(6px 17px 17px #8d4a6251);
    }
    .envelope-pocket { z-index: 3; }
    .flap {
      position: absolute;
      inset: 0 0 auto;
      height: 65.03%;
      z-index: 4;
      transform: perspective(880px) rotateX(0deg);
      transform-style: preserve-3d;
      transform-origin: center 1px;
      transition: transform .6s var(--ease) .08s, z-index 0s linear .43s;
      pointer-events: none;
    }
    .flap-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flap-face svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .flap-face--front { filter: drop-shadow(0 4px 3px #7d344b38); }
    .flap-face--inside { transform: rotateX(180deg); }
    .flap-face--inside svg { transform: scaleY(-1); }
    .stage.is-open .flap {
      z-index: 1;
      transform: perspective(880px) rotateX(124deg);
      transition-delay: .04s, .195s;
    }
    .seal {
      z-index: 5;
      width: 19%;
      aspect-ratio: 1;
      top: 61%;
      left: 50%;
      transform: translate(-50%,-50%) rotate(4deg);
      filter: drop-shadow(0 4px 5px #63263e62);
      transition: opacity .24s ease .31s, transform .38s var(--ease) .24s, filter .2s ease;
    }
    .stage.is-open .seal {
      opacity: 0;
      transform: translate(-50%,-84%) rotate(19deg) scale(.7);
      transition-delay: 0s;
    }

    .letter {
      position: absolute;
      z-index: 2;
      top: 4%;
      left: 50%;
      width: 92%;
      height: 112%;
      margin: 0;
      padding: 4.4% 5.5% 4.7%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: clamp(3px, calc(var(--envelope) * .009), 6px);
      isolation: isolate;
      border: 1px solid #e0bfb6;
      border-radius: 3px;
      background: linear-gradient(134deg, #fffcf5, #fff8ee 64%, #faf0e7);
      color: var(--ink);
      box-shadow: 0 2px 4px #743c4714, 0 11px 22px #743c4737;
      transform: translate(-50%, 6%) scale(.94);
      visibility: hidden;
      opacity: 0;
      transition: transform .61s var(--ease), opacity .2s ease .25s, z-index 0s .29s, visibility 0s .58s;
    }
    .letter::before, .letter::after {
      content: '';
      position: absolute;
      pointer-events: none;
    }
    .letter::before {
      z-index: -1;
      inset: 3%;
      border: 1px solid #e8cec3;
      box-shadow: 0 0 0 2px #fffaf1 inset, 0 0 0 3px #eedcd16c inset;
      border-radius: 1px;
    }
    .letter::after { inset: 0; background: var(--grain); opacity: .46; z-index: -1; }
    .stage.is-open .letter {
      z-index: 6;
      visibility: visible;
      opacity: 1;
      transform: translate(calc(-50% + var(--envelope) * .019),-34%) rotate(calc(-1 * var(--tilt))) scale(1.23);
      transition: transform .83s var(--ease) .20s, opacity .23s ease .24s, z-index 0s .46s, visibility 0s;
    }
    .card-topper { width: 16%; height: auto; color: #a9526c; flex: none; }
    .wish {
      max-width: 100%;
      margin: 0;
      font-family: var(--arabic);
      font-size: clamp(15.5px, calc(var(--envelope) * .056), 28px);
      font-weight: 400;
      line-height: 1.42;
      text-wrap: balance;
    }
    .wish:focus { outline: none; }
    .wish-title, .wish-line, .wish-love { display: block; }
    .wish-title, .wish-love {
      font-family: var(--hand);
      font-weight: 700;
      line-height: 1.18;
    }
    .wish-title {
      margin: 0 0 .13em;
      color: var(--wine);
      font-size: clamp(26px, calc(var(--envelope) * .103), 52px);
    }
    .wish-name { color: #9b4160; font-weight: 700; }
    .wish-love {
      margin-top: .10em;
      color: var(--rose);
      font-size: clamp(20px, calc(var(--envelope) * .066), 34px);
    }
    .signoff {
      position: relative;
      align-self: flex-end;
      margin: 0 0 0 clamp(4px, calc(var(--envelope) * .024), 13px);
      padding: 0 2px 5px;
      color: #843b52;
      font: 400 clamp(24px, calc(var(--envelope) * .077), 39px)/.94 var(--signature);
      white-space: nowrap;
      transform: rotate(-4deg);
    }
    .signoff svg {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 93%;
      height: auto;
      color: #a66072;
      pointer-events: none;
    }

    .actions { z-index: 2; display: grid; justify-items: center; gap: 10px; margin-top: 1px; }
    .actions[hidden] { display: none; }
    .action {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-width: 214px;
      min-height: 52px;
      padding: 10px 22px;
      border: 1px solid #6d243e;
      border-radius: 99px;
      cursor: pointer;
      background: linear-gradient(160deg, #893a55, #742841 73%);
      color: #fff7f2;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 1px 0 #ffced55c inset, 0 5px 13px #792b4529;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease, color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action svg { width: 17px; height: 17px; flex: 0 0 17px; transition: transform .24s var(--ease); }
    .action [hidden] { display: none; }
    .action:hover { transform: translateY(-2px); box-shadow: 0 1px 0 #ffced55c inset, 0 7px 18px #792b453d; }
    .action:not([aria-expanded='true']):hover svg { transform: translateX(-3px); }
    .action:active { transform: translateY(1px); }
    .action[aria-expanded='true'] {
      color: #79364c;
      background: #fff8f0a1;
      border-color: #c4959d;
      box-shadow: 0 3px 10px #792b4511;
    }
    .action-note { position: relative; }
    .hint { margin: 0; min-height: 17px; font-size: 12px; line-height: 17px; color: var(--muted); }
    .music-control {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 10px;
      border: 0;
      border-radius: 99px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.15;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .music-control:hover { color: var(--wine); }
    .music-control:focus-visible { outline-offset: 0; }
    .music-glyph {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid #dbbbbd;
      border-radius: 50%;
      background: #f2ddd9;
      color: #893d55;
      transition: background .2s ease;
    }
    .music-control:hover .music-glyph { background: #edced2; }
    .music-glyph svg { width: 11px; height: 11px; }
    .music-control[hidden], .music-glyph svg[hidden] { display: none; }
    .noscript { max-width: 26rem; margin: 0 1rem; font-family: var(--arabic); font-size: 1.35rem; }
    .noscript p { margin: .4em 0; }
    .noscript [lang='en'] { font: 400 1.85rem/1.1 var(--signature); color: var(--wine); }

    .confetti { position: absolute; z-index: 2; inset: 0; overflow: clip; pointer-events: none; }
    .confetti span {
      position: absolute;
      left: 50%;
      top: 46%;
      display: block;
      width: var(--size);
      height: var(--size);
      color: var(--color);
      opacity: 0;
      animation: toss 1.32s cubic-bezier(.12,.62,.41,1) var(--delay) both;
    }
    .confetti svg { display: block; width: 100%; height: 100%; }
    @keyframes toss {
      0% { opacity: 0; transform: translate(0, 0) rotate(0) scale(.3); }
      19% { opacity: .91; }
      64% { opacity: .78; }
      100% {
        opacity: 0;
        transform: translate(calc(var(--envelope) * var(--x)), calc(var(--envelope) * var(--y))) rotate(var(--turn)) scale(1);
      }
    }

    @media (max-width: 880px) {
      .stage { --envelope: min(465px, clamp(300px, 54svh, 465px), calc(100vw - 278px)); width: calc(100% - 16px); }
      .postmark { width: max(94px, calc(var(--envelope) * .27)); left: calc(50% + var(--envelope) * .45); top: 0; }
      .spark--nw { right: calc(50% + var(--envelope) * .485); }
      .spark--se { left: calc(50% + var(--envelope) * .45); bottom: 9%; }
    }
    @media (max-width: 640px) {
      .stage { --envelope: min(400px, calc(100vw - 65px)); --closed-center: 53%; margin-top: 10px; margin-bottom: 10px; height: calc(var(--envelope) * .62 + 98px); }
      .intro { --open-lift: 0px; padding-bottom: 0; }
      .eyebrow { font-size: 12px; }
      .eyebrow svg { width: 32px; }
      h1 { font-size: clamp(47px, 15.6vw, 81px); }
      .opening-arrow { width: clamp(28px, 8.4vw, 36px); }
      .postmark { width: clamp(81px, 22.6vw, 113px); left: auto; right: 1.5%; top: -1%; transform: rotate(13deg); }
      .spark--nw { width: 24px; height: 26px; top: 6%; right: auto; left: 5%; }
      .spark--se { width: 30px; height: 30px; left: auto; right: 2%; bottom: 9%; }
      .actions { margin-top: 4px; }
    }
    @media (max-width: 390px) {
      .wordmark, .edition { font-size: 12px; gap: 6px; }
      .wordmark svg { width: 27px; height: 29px; }
      .action { min-height: 48px; }
    }
    @media (max-width: 355px) {
      .stage { --envelope: calc(100vw - 52px); }
      h1 { font-size: 47px; }
      .postmark { right: -2px; top: -2%; }
      .spark--se { bottom: 5%; }
      .masthead, .colophon { margin-inline: 13px; }
      .colophon p { font-size: 11px; }
      .signoff { padding-bottom: 4px; }
    }
    @media (max-width: 310px) {
      h1 { font-size: clamp(37px, 15.5vw, 47px); }
      .letter { width: 93%; height: max(118%, 168px); padding: 4.4% 4.7%; }
      .wish { font-size: clamp(12px, 4.95vw, 15.5px); line-height: 1.37; }
      .wish-title { font-size: clamp(21px, 8.55vw, 26px); }
      .wish-love { font-size: 18px; }
      .signoff { font-size: 22px; }
      .action { min-width: min(204px, calc(100vw - 52px)); }
    }
    @media (max-height: 680px) {
      main { padding-block: 14px; }
      .masthead { min-height: 47px; }
      .colophon { min-height: 37px; }
      .stage { margin-bottom: 4px; }
      .action { min-height: 47px; }
      .actions { gap: 7px; }
    }
    @media (max-height: 600px) and (min-width: 641px) {
      .stage { --envelope: min(400px, max(250px, 53svh)); }
      h1 { font-size: clamp(47px, 11.6svh, 67px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .confetti { display: none; }
    }
  </style>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const intro = document.querySelector('.intro');
      const seal = document.getElementById('seal-button');
      const actions = document.getElementById('actions');
      const action = document.getElementById('action');
      const label = document.getElementById('action-label');
      const letter = document.getElementById('letter');
      const wish = document.getElementById('wish');
      const openIcon = document.getElementById('open-icon');
      const closeIcon = document.getElementById('close-icon');
      const hint = document.getElementById('hint');
      const music = document.getElementById('birthday-music');
      const musicControl = document.getElementById('music-control');
      const musicLabel = document.getElementById('music-label');
      const playMusicIcon = document.getElementById('play-music-icon');
      const pauseMusicIcon = document.getElementById('pause-music-icon');
      const confetti = document.getElementById('confetti');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const svgNS = 'http://www.w3.org/2000/svg';
      let open = false;
      let focusTimer;
      let cleanupTimer;

      // A small shower of paper hearts and sparkles, timed to the letter's rise.
      const pieces = [
        [-.42,-.27,-31,12],[-.53,-.12,24,10],[-.34,-.38,-31,8],[-.60,.04,-20,8],
        [-.46,.16,-59,11],[-.58,-.22,20,7],[.40,-.33,30,11],[.53,-.19,43,9],
        [.58,-.065,-13,7],[.61,.06,40,12],[.49,.19,62,7],[.29,-.39,47,8],
        [-.20,-.40,-15,6],[.08,-.43,16,8]
      ];
      const colors = ['#b65974', '#d58595', '#c38962', '#e2a7ae'];

      function celebrate() {
        confetti.replaceChildren();
        pieces.forEach(([x,y,turn,size], i) => {
          const piece = document.createElement('span');
          piece.style.setProperty('--x', x);
          piece.style.setProperty('--y', y);
          piece.style.setProperty('--turn', `${turn}deg`);
          piece.style.setProperty('--size', `${size}px`);
          piece.style.setProperty('--delay', `${225 + ((i * 29) % 115)}ms`);
          piece.style.setProperty('--color', colors[i % colors.length]);
          const svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('viewBox', '0 0 24 24');
          const shape = document.createElementNS(svgNS, 'use');
          shape.setAttribute('href', i % 3 === 1 ? '#sparkle' : '#heart');
          shape.setAttribute('fill', 'currentColor');
          svg.append(shape);
          piece.append(svg);
          confetti.append(piece);
        });
        cleanupTimer = setTimeout(() => confetti.replaceChildren(), 1700);
      }

      function updateMusicControl() {
        const playing = !music.paused && !music.ended;
        musicLabel.textContent = playing ? 'وقّفي الموسيقى' : music.ended ? 'شغّلي الموسيقى تاني' :
          music.currentTime > 0 ? 'كمّلي الموسيقى' : 'شغّلي الموسيقى';
        playMusicIcon.toggleAttribute('hidden', playing);
        pauseMusicIcon.toggleAttribute('hidden', !playing);
      }

      function playMusic() {
        if (music.ended) music.currentTime = 0;
        // Stay in the click/tap handler instead of waiting for the envelope animation.
        music.play()?.catch(updateMusicControl);
        updateMusicControl();
      }

      function resetMusic() {
        music.pause();
        if (music.currentTime > 0) music.currentTime = 0;
        updateMusicControl();
      }

      for (const event of ['play', 'pause', 'ended', 'error']) {
        music.addEventListener(event, updateMusicControl);
      }
      musicControl.addEventListener('click', () => {
        if (!open) return;
        if (!music.paused && !music.ended) music.pause();
        else playMusic();
      });

      function setOpen(next) {
        if (next === open) return;
        open = next;
        clearTimeout(focusTimer);
        clearTimeout(cleanupTimer);
        stage.classList.toggle('is-open', open);
        intro.classList.toggle('is-lifted', open);
        action.setAttribute('aria-expanded', String(open));
        label.textContent = open ? 'اقفلي الظرف' : 'افتحي الظرف';
        openIcon.toggleAttribute('hidden', open);
        closeIcon.toggleAttribute('hidden', !open);
        seal.hidden = open;
        hint.textContent = open ? '' : 'أو اضغطي على الختم';
        musicControl.hidden = !open;

        if (open) {
          playMusic();
          letter.setAttribute('aria-hidden', 'false');
          if (!reducedMotion.matches) celebrate();
          const focusWish = () => {
            if (!open || ![document.body, action, seal].includes(document.activeElement)) return;
            wish.focus({preventScroll: true});
            const {top, bottom} = wish.getBoundingClientRect();
            if (top < 0 || bottom > innerHeight) wish.scrollIntoView({block: 'nearest'});
          };
          if (reducedMotion.matches) requestAnimationFrame(focusWish);
          else focusTimer = setTimeout(focusWish, 850);
        } else {
          resetMusic();
          action.focus({preventScroll: true});
          letter.setAttribute('aria-hidden', 'true');
          confetti.replaceChildren();
        }
      }

      seal.addEventListener('click', () => setOpen(true));
      action.addEventListener('click', () => setOpen(!open));
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && open) setOpen(false);
      });
      seal.hidden = false;
      actions.hidden = false;
    })();
  </script>
